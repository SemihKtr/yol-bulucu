<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bağlıca Yol Bulucu — Servis Güzergahları & Ev Konumları</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  :root{
    --ink:#1c2321;
    --paper:#f6f4ee;
    --panel:#fffdf8;
    --line:#e4ddc9;
    --accent:#2f6f4f;
    --accent2:#c1542c;
    --muted:#7a7568;
    --shadow: 0 8px 24px rgba(28,35,33,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);}
  #app{display:flex;flex-direction:column;height:100vh;}

  header{
    padding:14px 18px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    z-index:1000;
  }
  header h1{
    font-size:16px;
    margin:0;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  header h1 span{color:var(--accent);}
  header .sub{font-size:11px;color:var(--muted);margin-top:2px;}

  #addBtn{
    background:var(--accent2);
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    box-shadow: 0 2px 8px rgba(193,84,44,0.35);
  }
  #addBtn:active{transform:translateY(1px);}

  #main{flex:1;display:flex;min-height:0;position:relative;}

  #map{flex:1;min-width:0;}

  #sidebar{
    width:280px;
    background:var(--panel);
    border-right:1px solid var(--line);
    overflow-y:auto;
    flex-shrink:0;
  }
  #sidebar.hidden{display:none;}

  .sidebar-section{padding:14px 16px;border-bottom:1px solid var(--line);}
  .sidebar-section h2{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    margin:0 0 10px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .sidebar-section h2 button{
    font-size:10px;
    background:none;
    border:1px solid var(--line);
    border-radius:6px;
    padding:3px 7px;
    color:var(--muted);
    cursor:pointer;
    text-transform:none;
    letter-spacing:0;
  }

  .route-group-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:11px;
    font-weight:700;
    color:var(--ink);
    margin:14px 0 4px 0;
    padding-bottom:4px;
    border-bottom:1px solid var(--line);
  }
  .route-group-header:first-child{margin-top:0;}
  .route-group-header .count{font-weight:400;color:var(--muted);}
  .route-group-header button{
    font-size:10px;
    background:none;
    border:1px solid var(--line);
    border-radius:6px;
    padding:2px 6px;
    color:var(--muted);
    cursor:pointer;
  }

  .route-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 4px;
    border-radius:8px;
    cursor:pointer;
    font-size:12.5px;
    line-height:1.3;
  }
  .route-item:hover{background:var(--paper);}
  .route-item input{margin:0;accent-color:var(--accent);flex-shrink:0;}
  .swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
  .route-item .label{flex:1;}
  .route-item.dim{opacity:0.45;}

  .home-item{
    padding:10px;
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:8px;
    background:var(--paper);
    cursor:pointer;
  }
  .home-item .name{font-weight:700;font-size:13px;margin-bottom:2px;}
  .home-item .addr{font-size:11px;color:var(--muted);}
  .home-item .del{
    float:right;
    background:none;border:none;color:var(--muted);
    font-size:11px;cursor:pointer;
  }
  #emptyHomes{font-size:12px;color:var(--muted);font-style:italic;padding:6px 4px;}

  #sidebarToggle{
    position:absolute;
    top:12px;
    left:12px;
    z-index:900;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    width:34px;height:34px;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:var(--shadow);
  }

  /* Modal */
  #modalOverlay{
    position:fixed;inset:0;
    background:rgba(28,35,33,0.45);
    display:none;
    align-items:center;justify-content:center;
    z-index:2000;
    padding:16px;
  }
  #modalOverlay.show{display:flex;}
  #modal{
    background:var(--panel);
    border-radius:16px;
    padding:22px;
    width:100%;
    max-width:400px;
    box-shadow:var(--shadow);
  }
  #modal h3{margin:0 0 4px 0;font-size:17px;}
  #modal .modal-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
  #modal label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--muted);
    margin:12px 0 6px 0;
  }
  #modal input[type=text]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    background:#fff;
  }
  #modal .hint{font-size:11px;color:var(--muted);margin-top:4px;}
  #modal .btn-row{display:flex;gap:8px;margin-top:20px;}
  #modal button{
    flex:1;
    padding:11px;
    border-radius:9px;
    border:none;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  #cancelBtn{background:var(--paper);color:var(--ink);border:1px solid var(--line) !important;}
  #saveBtn{background:var(--accent);color:#fff;}
  #saveBtn:disabled{opacity:0.5;cursor:default;}
  #statusMsg{font-size:12px;margin-top:10px;min-height:16px;}
  #statusMsg.err{color:var(--accent2);}
  #statusMsg.ok{color:var(--accent);}

  .leaflet-popup-content{font-size:12.5px;}
  .stop-dot{
    background:#fff;
    border-radius:50%;
  }
  .home-pin-icon{
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
  }

  @media (max-width: 720px){
    #sidebar{
      position:absolute;
      top:0;left:0;bottom:0;
      z-index:800;
      width:82%;
      max-width:320px;
      box-shadow:var(--shadow);
    }
    #sidebarToggle{display:flex;}
    header h1{font-size:14px;}
    #addBtn{padding:9px 12px;font-size:12px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Bağlıca <span>Yol Bulucu</span></h1>
      <div class="sub">Başkent Üni. servis güzergahları + ev konumların</div>
    </div>
    <button id="addBtn">+ Konum Ekle</button>
  </header>

  <div id="main">
    <button id="sidebarToggle">☰</button>
    <div id="sidebar">
      <div class="sidebar-section">
        <h2>Servis Güzergahları <button id="toggleAllRoutes">hepsi aç/kapa</button></h2>
        <div id="routeList"></div>
      </div>
      <div class="sidebar-section">
        <h2>Kayıtlı Evlerim</h2>
        <div id="homeList"></div>
        <div id="emptyHomes">Henüz ev eklenmedi. Yukarıdaki "Konum Ekle" butonuyla başla.</div>
      </div>
    </div>
    <div id="map"></div>
  </div>
</div>

<div id="modalOverlay">
  <div id="modal">
    <h3>Yeni ev konumu ekle</h3>
    <div class="modal-sub">Adres veya mahalle yaz, otomatik haritada bulalım.</div>

    <label>Ev ismi (senin verdiğin)</label>
    <input type="text" id="homeName" placeholder="Örn. Çankaya 2+1 ev">

    <label>Adres / Mahalle <span style="text-transform:none;font-weight:400;">(link verdiysen boş bırakabilirsin)</span></label>
    <input type="text" id="homeAddress" placeholder="Örn. Çayyolu, Ümitköy, Ankara">
    <div class="hint">Ne kadar detaylı yazarsan o kadar isabetli bulunur.</div>

    <label>Sahibinden linki <span style="text-transform:none;">(opsiyonel, adres yoksa linkten konum çıkarılır)</span></label>
    <input type="text" id="homeLink" placeholder="https://www.sahibinden.com/ilan/...">

    <div id="statusMsg"></div>

    <div class="btn-row">
      <button id="cancelBtn">Vazgeç</button>
      <button id="saveBtn">Konumu Bul & Kaydet</button>
    </div>
  </div>
</div>

// Color palette (visually distinct, avoids near-duplicates)
const PALETTE = [
  '#2f6f4f','#c1542c','#3d5a80','#9b2226','#6a4c93',
  '#e09f3e','#1b998b','#8d5524','#457b9d','#bc6c25',

];

const routeLayers = [];
const routeListEl = document.getElementById('routeList');

function classifyRoute(name){
  const n = name.toLocaleLowerCase('tr-TR');
  if (n.includes('geliş')) return 'Geliş (Okula)';
  if (n.includes('gidiş')) return 'Gidiş (Eve)';
  return 'Diğer';
}

const GROUP_ORDER = ['Geliş (Okula)', 'Gidiş (Eve)', 'Diğer'];
const grouped = { 'Geliş (Okula)': [], 'Gidiş (Eve)': [], 'Diğer': [] };

ROUTES.forEach((route, idx) => {
  const color = PALETTE[idx % PALETTE.length];
  const latlngs = route.path.map(p => [p[1], p[0]]); // lng,lat -> lat,lng

  const line = L.polyline(latlngs, {
    color: color,
    weight: 4,
    opacity: 0.85,
    lineJoin: 'round'
  });

  const stopMarkers = L.layerGroup();
  (route.stops || []).forEach(s => {
    const dot = L.circleMarker([s.lat, s.lng], {
      radius: 5,
      fillColor: color,
      color: '#fff',
      weight: 2,
      fillOpacity: 1,
      className: 'stop-dot'
    }).bindPopup(`<b>${escapeHtml(s.name)}</b><br><span style="color:${color}">${escapeHtml(route.name)}</span>`);
    stopMarkers.addLayer(dot);
  });

  const layerGroupObj = L.layerGroup([line, stopMarkers]).addTo(map);
  routeLayers.push({ name: route.name, color, group: layerGroupObj, visible: true, line });

  grouped[classifyRoute(route.name)].push(idx);
});

GROUP_ORDER.forEach(groupName => {
  const idxList = grouped[groupName];
  if (idxList.length === 0) return;

  const header = document.createElement('div');
  header.className = 'route-group-header';
  header.innerHTML = `<span>${groupName} <span class="count">(${idxList.length})</span></span><button data-group="${groupName}">aç/kapa</button>`;
  routeListEl.appendChild(header);

  header.querySelector('button').addEventListener('click', () => {
    const groupCheckboxes = idxList.map(i => document.querySelector(`#routeList input[data-idx="${i}"]`));
    const anyVisible = idxList.some(i => routeLayers[i].visible);
    groupCheckboxes.forEach(cb => {
      cb.checked = !anyVisible;
      cb.dispatchEvent(new Event('change'));
    });
  });

  idxList.forEach(idx => {
    const route = ROUTES[idx];
    const layerInfo = routeLayers[idx];
    const item = document.createElement('div');
    item.className = 'route-item';
    item.innerHTML = `
      <input type="checkbox" checked data-idx="${idx}">
      <span class="swatch" style="background:${layerInfo.color}"></span>
      <span class="label">${escapeHtml(route.name)}</span>
    `;
    const checkbox = item.querySelector('input');
    checkbox.addEventListener('change', () => {
      if (checkbox.checked) {
        layerInfo.group.addTo(map);
        layerInfo.visible = true;
        item.classList.remove('dim');
      } else {
        map.removeLayer(layerInfo.group);
        layerInfo.visible = false;
        item.classList.add('dim');
      }
    });
    item.addEventListener('mouseenter', () => layerInfo.line.setStyle({weight: 7}));
    item.addEventListener('mouseleave', () => layerInfo.line.setStyle({weight: 4}));
    routeListEl.appendChild(item);
  });
});

document.getElementById('toggleAllRoutes').addEventListener('click', () => {
  const anyVisible = routeLayers.some(r => r.visible);
  document.querySelectorAll('#routeList input[type=checkbox]').forEach(cb => {
    cb.checked = !anyVisible;
    cb.dispatchEvent(new Event('change'));
  });
});

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

let homes = [];
let homeMarkers = {};

async function loadHomes(){
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/homes?select=*&order=created_at.asc`, {
      headers: supabaseHeaders()
    });
    if (!res.ok) throw new Error('fetch failed');
    const rows = await res.json();
    homes = rows.map(r => ({ id: r.id, name: r.name, address: r.address, link: r.link, lat: r.lat, lng: r.lng }));
  } catch(e) {
    console.error('Evler yüklenemedi:', e);
    homes = [];
  }
  renderHomes();
}

async function insertHome(home){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/homes`, {
    method: 'POST',
    headers: supabaseHeaders({ 'Content-Type': 'application/json', 'Prefer': 'return=representation' }),
    body: JSON.stringify({
      name: home.name, address: home.address, link: home.link || null, lat: home.lat, lng: home.lng
    })
  });
  if (!res.ok) throw new Error('insert failed');
  const rows = await res.json();
  return rows[0];
}

async function deleteHome(id){
  await fetch(`${SUPABASE_URL}/rest/v1/homes?id=eq.${id}`, {
    method: 'DELETE',
    headers: supabaseHeaders()
  });
}

function renderHomes(){
  const listEl = document.getElementById('homeList');
  const emptyEl = document.getElementById('emptyHomes');
  listEl.innerHTML = '';

  Object.values(homeMarkers).forEach(m => map.removeLayer(m));
  homeMarkers = {};

  if (homes.length === 0){
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
  }

  homes.forEach(h => {
    const item = document.createElement('div');
    item.className = 'home-item';
    item.innerHTML = `
      <button class="del" data-id="${h.id}">sil ✕</button>
      <div class="name">🏠 ${escapeHtml(h.name)}</div>
      <div class="addr">${escapeHtml(h.address)}</div>
    `;
    item.addEventListener('click', (e) => {
      if (e.target.classList.contains('del')) return;
      map.setView([h.lat, h.lng], 15);
      homeMarkers[h.id].openPopup();
      if (window.innerWidth <= 720) sidebar.classList.add('hidden');
    });
    item.querySelector('.del').addEventListener('click', async (e) => {
      e.stopPropagation();
      await deleteHome(h.id);
      homes = homes.filter(x => x.id !== h.id);
      renderHomes();
    });
    listEl.appendChild(item);

    const linkHtml = h.link ? `<br><a href="${h.link}" target="_blank" rel="noopener">İlanı aç ↗</a>` : '';
    const marker = L.marker([h.lat, h.lng], {icon: HOME_ICON()})
      .addTo(map)
      .bindPopup(`<b>🏠 ${escapeHtml(h.name)}</b><br>${escapeHtml(h.address)}${linkHtml}`);
    homeMarkers[h.id] = marker;
  });
}

  'isyeri','dukkan','arsa','depo','yazlik','m2','metrekare','metrekareli','yapili',
  'salonlu','odali','residans','komple','tam','yari','bahceli','deniz','manzarali',
  'sahibinden','satilikdaire','kiralikdaire'
]);

function extractQueryFromSahibindenLink(url){
  try{
    const u = new URL(url);
    if (!u.hostname.includes('sahibinden.com')) return null;
    const segments = u.pathname.split('/').filter(Boolean);
    let slug = '';
    for (const seg of segments){
      if (/^\d+$/.test(seg)) continue;
      if (seg.length > slug.length) slug = seg;
    }
    if (!slug) return null;

    const words = slug.split('-').filter(w => {
      if (!w) return false;
      if (/^\d+$/.test(w)) return false;
      if (w.length <= 1) return false;
      if (SLUG_STOPWORDS.has(w.toLowerCase())) return false;
      return true;
    });

    if (words.length === 0) return null;
    return words.join(' ');
  } catch(e){
    return null;
  }
}

saveBtn.addEventListener('click', async () => {
  const name = document.getElementById('homeName').value.trim();
  const address = document.getElementById('homeAddress').value.trim();
  const link = document.getElementById('homeLink').value.trim();

  if (!name){
    statusMsg.textContent = 'İsim alanı zorunlu.';
    statusMsg.className = 'err';
    return;
  }

  let searchQuery = address;
  let derivedFromLink = false;

  if (!searchQuery && link){
    const extracted = extractQueryFromSahibindenLink(link);
    if (extracted){
      searchQuery = extracted;
      derivedFromLink = true;
    } else {
      statusMsg.textContent = 'Linkten konum çıkaramadım, lütfen adres/mahalle de yaz.';
      statusMsg.className = 'err';
      return;
    }
  }

  if (!searchQuery){
    statusMsg.textContent = 'Adres yaz ya da bir sahibinden linki yapıştır.';
    statusMsg.className = 'err';
    return;
  }

  saveBtn.disabled = true;
  statusMsg.textContent = derivedFromLink
    ? `Linkten "${searchQuery}" bulundu, konum aranıyor…`
    : 'Konum aranıyor…';
  statusMsg.className = '';

  try {
    const query = encodeURIComponent(searchQuery + ', Ankara, Türkiye');
    const url = `https://nominatim.openstreetmap.org/search?q=${query}&format=json&limit=1`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'tr' } });
    const data = await res.json();

    if (!data || data.length === 0){
      statusMsg.textContent = 'Bu adres bulunamadı, biraz daha detay eklemeyi dene.';
      statusMsg.className = 'err';
      saveBtn.disabled = false;
      return;
    }

    const lat = parseFloat(data[0].lat);
    const lng = parseFloat(data[0].lon);

    const newHome = {
      name, address: address || searchQuery, link, lat, lng
    };
    const inserted = await insertHome(newHome);
    homes.push({ id: inserted.id, name: inserted.name, address: inserted.address, link: inserted.link, lat: inserted.lat, lng: inserted.lng });
    renderHomes();

    statusMsg.textContent = 'Kaydedildi ✓';
    statusMsg.className = 'ok';
    setTimeout(() => { overlay.classList.remove('show'); saveBtn.disabled = false; }, 500);
    map.setView([lat, lng], 15);

  } catch(e) {
    statusMsg.textContent = 'Bir hata oluştu, tekrar dene.';
    statusMsg.className = 'err';
    saveBtn.disabled = false;
  }
});

loadHomes();
</script>
